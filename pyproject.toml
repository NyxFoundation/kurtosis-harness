[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kurtosis-harness"
version = "0.1.0"
description = "Finding-driven, client-agnostic reproduction harness for Ethereum-client audit findings"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "cryptography>=42",
    "pycryptodome>=3.20",
    "coincurve>=19",  # secp256k1 recoverable sigs (RLPx handshake)
    "cramjam>=2.7",   # snappy framing (RLPx)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
# package-at-root: the `harness` package lives at the repository root
packages = ["harness", "harness.drivers", "harness.drivers.rlpx", "harness.probes", "harness.devnet"]
package-dir = {"harness" = "."}

[tool.pytest.ini_options]
testpaths = ["tests"]
